AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Template for deploying a Lambda function with Floci hot-reload functionality.

Parameters:
  DeploymentEnvironment:
    Type: String
    Default: local
    AllowedValues:
      - local
      - dev
      - staging
      - prod
    Description: Deployment environment name.

  LambdaCodeBucket:
    Type: String
    Default: hot-reload
    Description: >
      S3 bucket containing the Lambda deployment package. For Floci hot-reload,
      use the special value 'hot-reload' to mount source code directly from the
      Docker host instead of loading a ZIP package from S3.

  LambdaCodeKey:
    Type: String
    Description: >
      S3 object key of the Lambda deployment package. For Floci hot-reload,
      specify an absolute path on the Docker host containing the Lambda source
      code. This directory is mounted read-only into /var/task and changes are
      reflected immediately without uploading artifacts or redeploying the
      function.

Resources:
  # -------------------------
  # Lambda Execution Role
  # -------------------------

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # -------------------------
  # Hot-Reload Function
  # -------------------------

  HotReloadFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-function-${DeploymentEnvironment}"
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128

      Environment:
        Variables:
          ENVIRONMENT: !Ref DeploymentEnvironment

      LoggingConfig:
        LogGroup: !Ref HotReloadFunctionLogGroup
        LogFormat: JSON

      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey

  # -------------------------
  # Lambda Log Groups
  # -------------------------

  HotReloadFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-function-${DeploymentEnvironment}"
      RetentionInDays: 7

Outputs:
  FunctionArn:
    Value: !GetAtt HotReloadFunction.Arn
