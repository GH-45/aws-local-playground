AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Template for deploying an HTTP API Gateway (v2) integrated with a Lambda function
  that inserts records into a DynamoDB table.

Parameters:
  DeploymentEnvironment:
    Type: String
    Default: local
    AllowedValues:
      - local
      - dev
      - staging
      - prod
    Description: Deployment environment name.

Resources:
  # -------------------------
  # DynamoDB Table
  # -------------------------

  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-items-${DeploymentEnvironment}"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH

  # -------------------------
  # Lambda Execution Role
  # -------------------------

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDbPutItemPolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                Resource: !GetAtt ItemsTable.Arn

  # -------------------------
  # Create Item Function
  # -------------------------

  CreateItemFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-create-item-function-${DeploymentEnvironment}"
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128

      Environment:
        Variables:
          ENVIRONMENT: !Ref DeploymentEnvironment
          TABLE_NAME: !Ref ItemsTable

      LoggingConfig:
        LogGroup: !Ref CreateItemFunctionLogGroup
        LogFormat: JSON

      Code:
        ZipFile: |
          import json
          import os
          import uuid
          import boto3

          dynamodb = boto3.resource("dynamodb")
          table = dynamodb.Table(os.environ["TABLE_NAME"])

          def lambda_handler(event, context):
              try:
                  body = json.loads(event.get("body") or "{}")
              except json.JSONDecodeError:
                  return {
                      "statusCode": 400,
                      "headers": {"Content-Type": "application/json"},
                      "body": json.dumps({"message": "Invalid JSON body"})
                  }

              item = {
                  "id": str(uuid.uuid4()),
                  **{k: v for k, v in body.items() if k != "id"}
              }

              table.put_item(Item=item)

              return {
                  "statusCode": 201,
                  "headers": {"Content-Type": "application/json"},
                  "body": json.dumps({
                      "message": "Item created successfully",
                      "item": item
                  })
              }

  # -------------------------
  # API Gateway v2 - HTTP API
  # -------------------------

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-http-api-${DeploymentEnvironment}"
      ProtocolType: HTTP
      Description: Example of API Gateway v2 integration with Lambda and DynamoDB

  # -------------------------
  # API Gateway v2 - Stage
  # -------------------------

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: !Ref DeploymentEnvironment
      AutoDeploy: true

  # -------------------------
  # API Gateway v2 - Integrations
  # -------------------------

  CreateItemFunctionIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt CreateItemFunction.Arn
      PayloadFormatVersion: "2.0"

  # -------------------------
  # API Gateway v2 - Routes
  # -------------------------

  CreateItemRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "POST /items"
      Target: !Sub "integrations/${CreateItemFunctionIntegration}"

  # -------------------------
  # Lambda Permissions
  # -------------------------

  CreateItemFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CreateItemFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/POST/items"

  # -------------------------
  # Lambda Log Groups
  # -------------------------

  CreateItemFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-create-item-function-${DeploymentEnvironment}"
      RetentionInDays: 7

Outputs:
  ApiEndpoint:
    Description: Base URL of the HTTP API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${DeploymentEnvironment}"

  CreateItemEndpoint:
    Description: Endpoint to create items in DynamoDB
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${DeploymentEnvironment}/items"

  TableName:
    Description: Name of the DynamoDB table
    Value: !Ref ItemsTable
