AWSTemplateFormatVersion: "2010-09-09"

Description: >
  Template for deploying an HTTP API Gateway (v2) integrated with Lambda functions.

Parameters:
  DeploymentEnvironment:
    Type: String
    Default: local
    AllowedValues:
      - local
      - dev
      - staging
      - prod
    Description: Deployment environment name.

Resources:
  # -------------------------
  # Lambda Execution Role
  # -------------------------

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # -------------------------
  # Health Check Function
  # -------------------------

  HealthFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-health-function-${DeploymentEnvironment}"
      Runtime: python3.12
      Handler: lambda_function.lambda_handler
      Role: !GetAtt LambdaExecutionRole.Arn
      Timeout: 30
      MemorySize: 128

      Environment:
        Variables:
          ENVIRONMENT: !Ref DeploymentEnvironment

      LoggingConfig:
        LogGroup: !Ref HealthFunctionLogGroup
        LogFormat: JSON

      Code:
        ZipFile: |
          import json

          def lambda_handler(event, context):
              return {
                  "statusCode": 200,
                  "headers": {"Content-Type": "application/json"},
                  "body": json.dumps({
                      "status": "healthy",
                      "checks": {
                          "api_gateway": "ok",
                          "lambda": "ok",
                      }
                  })
              }

  # -------------------------
  # API Gateway v2 - HTTP API
  # -------------------------

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${AWS::StackName}-http-api-${DeploymentEnvironment}"
      ProtocolType: HTTP
      Description: Example of API Gateway v2 integration with Lambda

  # -------------------------
  # API Gateway v2 - Stage
  # -------------------------

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: !Ref DeploymentEnvironment
      AutoDeploy: true

  # -------------------------
  # API Gateway v2 - Integrations
  # -------------------------

  HealthFunctionIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt HealthFunction.Arn
      PayloadFormatVersion: "2.0"

  # -------------------------
  # API Gateway v2 - Routes
  # -------------------------

  HealthRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: "GET /health"
      Target: !Sub "integrations/${HealthFunctionIntegration}"

  # -------------------------
  # Lambda Permissions
  # -------------------------

  HealthFunctionInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref HealthFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceAccount: !Ref AWS::AccountId
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/GET/health"

  # -------------------------
  # Lambda Log Groups
  # -------------------------

  HealthFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-health-function-${DeploymentEnvironment}"
      RetentionInDays: 7

Outputs:
  ApiEndpoint:
    Description: Base URL of the HTTP API
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${DeploymentEnvironment}"

  HealthEndpoint:
    Description: Health check endpoint
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com/${DeploymentEnvironment}/health"
